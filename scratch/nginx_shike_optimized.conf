server {
    server_name shike.store www.shike.store;

    client_max_body_size 50m;

    # SSE 流式生成接口专属配置 (禁用缓冲，保障 SSE 实时到达小程序)
    location /api/v1/plan/generate/stream {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 全局常规接口配置
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/shike.store/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/shike.store/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.shike.store) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = shike.store) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name shike.store www.shike.store;
    return 404; # managed by Certbot
}
